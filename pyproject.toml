[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lightweight-ai-harness"
version = "0.1.0"
description = "A small Python foundation for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.10,<3", "typer>=0.12,<1"]

[project.scripts]
harness = "harness.cli.main:app"

[project.urls]
Homepage = "https://github.com/yash55-sop/AI-Harness"
Repository = "https://github.com/yash55-sop/AI-Harness"
Documentation = "https://github.com/yash55-sop/AI-Harness/tree/main/docs"
Issues = "https://github.com/yash55-sop/AI-Harness/issues"

[project.optional-dependencies]
openai = ["httpx>=0.27,<1"]
all = ["httpx>=0.27,<1"]
dev = [
    "httpx>=0.27,<1",
    "twine>=6,<7",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "build>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/harness"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src", "/tests", "/docs", "/examples", "/.github", "/scripts",
    "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: explicitly enabled paid API smoke tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/harness"]
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["harness"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
